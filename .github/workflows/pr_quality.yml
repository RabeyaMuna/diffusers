name: Run code quality checks

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check_code_quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Start PyPI Wayback
      id: wayback
      timeout-minutes: 2
      run: |
        docker run -d --name pypi-wayback -p 127.0.0.1:8629:8080 \
          ghcr.io/waleko/pypi-wayback

        for attempt in $(seq 1 15); do
          if curl --fail --silent \
            --connect-timeout 2 --max-time 5 \
            "http://localhost:8629/2024-01-10/" -o /dev/null; then
            echo "index_url=http://localhost:8629/2024-01-10" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Wayback ready."
            exit 0
          fi
          sleep 2
        done

        echo "::warning::Wayback not ready, falling back to PyPI."
        echo "index_url=https://pypi.org/simple" >> "$GITHUB_OUTPUT"
        echo "ready=false" >> "$GITHUB_OUTPUT"

    - name: Install dependencies via Wayback
      id: install_wayback
      if: steps.wayback.outputs.ready == 'true'
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 30 \
          --index-url "http://localhost:8629/2024-01-10" \
          ".[quality]"

    - name: Install dependencies via PyPI (fallback)
      if: steps.wayback.outputs.ready != 'true' || steps.install_wayback.outcome
        == 'failure'
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 30 \
          --index-url https://pypi.org/simple \
          ".[quality]"

    - name: Check Ruff lint
      run: ruff check examples tests src utils scripts

    - name: Check Ruff formatting
      run: ruff format examples tests src utils scripts --check

  check_repository_consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check_code_quality
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Start PyPI Wayback
      id: wayback
      timeout-minutes: 2
      run: |
        docker run -d --name pypi-wayback -p 127.0.0.1:8629:8080 \
          ghcr.io/waleko/pypi-wayback

        for attempt in $(seq 1 15); do
          if curl --fail --silent \
            --connect-timeout 2 --max-time 5 \
            "http://localhost:8629/2024-01-10/" -o /dev/null; then
            echo "index_url=http://localhost:8629/2024-01-10" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Wayback ready."
            exit 0
          fi
          sleep 2
        done

        echo "::warning::Wayback not ready, falling back to PyPI."
        echo "index_url=https://pypi.org/simple" >> "$GITHUB_OUTPUT"
        echo "ready=false" >> "$GITHUB_OUTPUT"

    - name: Install dependencies via Wayback
      id: install_wayback
      if: steps.wayback.outputs.ready == 'true'
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 30 \
          --index-url "http://localhost:8629/2024-01-10" \
          ".[quality]"

    - name: Install dependencies via PyPI (fallback)
      if: steps.wayback.outputs.ready != 'true' || steps.install_wayback.outcome
        == 'failure'
      run: |
        python -m pip install --upgrade pip
        pip install --retries 5 --timeout 30 \
          --index-url https://pypi.org/simple \
          ".[quality]"

    - name: Check repository consistency
      run: |
        python utils/check_copies.py
        python utils/check_dummies.py
        make deps_table_check_updated
